name: CodeQL

# Phase 0's app/ is a static HTML/nginx placeholder with no JS/TS — pointing
# CodeQL at "javascript" with zero real source hard-fails ("no source code
# seen during build"), it doesn't silently no-op. Scan "actions" instead:
# it analyzes our real .github/workflows/*.yml for injection-style issues,
# which is actually useful content today. Add app-language coverage once a
# stack ADR picks a real language for app/.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      matrix:
        language: ["actions"]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
