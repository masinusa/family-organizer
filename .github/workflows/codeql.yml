name: CodeQL

# Phase 0's app/ is a static HTML/nginx placeholder with nothing meaningful
# to analyze yet. The "javascript" language below is a placeholder to keep
# this workflow valid; update the matrix once a real app stack (docs/adr/)
# is chosen.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      matrix:
        language: ["javascript"]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
