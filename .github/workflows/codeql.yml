name: CodeQL

# app/ was a static HTML/nginx placeholder with no JS/TS at first — pointing
# CodeQL at "javascript" with zero real source hard-failed ("no source code
# seen during build"), it didn't silently no-op. "actions" was added instead:
# it analyzes our real .github/workflows/*.yml for injection-style issues,
# which was useful content on its own. Now that ADR 0005 picked Node/TS for
# app/, "javascript-typescript" is scanned too.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      matrix:
        language: ["actions", "javascript-typescript"]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
